<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdShield Web Guard</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      width: 300px;
      background: #0d151c;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1f2937;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      color: #10d499;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #1f2937;
    }
    .label-title {
      font-size: 13px;
      font-weight: 600;
    }
    .label-sub {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 2px;
    }
    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #10d499;
    }
    .btn {
      margin-top: 12px;
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #374151;
      background: #1f2937;
      color: #e5e7eb;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>🛡️</div>
    <div>
      <div class="title">AdShield Web Guard</div>
      <div class="label-sub">Chặn nhảy trang & Nhấn giữ xóa khung</div>
    </div>
  </div>

  <div class="row">
    <div>
      <div class="label-title">Khóa Mọi Liên Kết (Strict Lock)</div>
      <div class="label-sub">Bấm vào bất kỳ link nào cũng không mở</div>
    </div>
    <input type="checkbox" id="strictLockAllLinks">
  </div>

  <div class="row">
    <div>
      <div class="label-title">Chặn Mở Trang Khác (Redirect)</div>
      <div class="label-sub">Chặn nhảy tab mới & tên miền lạ</div>
    </div>
    <input type="checkbox" id="blockExternalNav">
  </div>

  <div class="row">
    <div>
      <div class="label-title">Nhấn Giữ Để Chặn Panel</div>
      <div class="label-sub">Nhấn giữ 0.6s vào khung quảng cáo để xóa</div>
    </div>
    <input type="checkbox" id="longPressZapEnabled">
  </div>

  <button class="btn" id="clearZappedBtn">Khôi phục các khung đã ẩn</button>

  <script src="popup.js"></script>
</body>
</html>
