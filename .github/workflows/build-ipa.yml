name: Build Unsigned iOS IPA

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-unsigned-ipa:
    name: Build AdShieldPro Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Generate Xcode Project from project.yml
        run: |
          xcodegen generate
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' AdShieldPro.xcodeproj/project.pbxproj
          sed -i '' 's/preferredProjectObjectVersion = 77;/preferredProjectObjectVersion = 56;/g' AdShieldPro.xcodeproj/project.pbxproj

      - name: Build Unsigned .app (Release - iphoneos)
        run: |
          xcodebuild clean build \
            -project AdShieldPro.xcodeproj \
            -scheme AdShieldPro \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Fake-Sign with ldid (Optional for TrollStore / Sideloadly compatibility)
        run: |
          if ! command -v ldid &> /dev/null; then
            brew install ldid
          fi
          APP_PATH="build/Build/Products/Release-iphoneos/AdShieldPro.app"
          if [ -d "$APP_PATH/PlugIns/SafariBlocker.appex" ]; then
            ldid -SSafariBlocker/SafariBlocker.entitlements "$APP_PATH/PlugIns/SafariBlocker.appex/SafariBlocker" || true
          fi
          ldid -SAdShieldPro/AdShieldPro.entitlements "$APP_PATH/AdShieldPro" || true

      - name: Package into Unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/AdShieldPro.app" Payload/
          zip -r9 AdShieldPro-Unsigned.ipa Payload
          rm -rf Payload
          ls -lh AdShieldPro-Unsigned.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdShieldPro-Unsigned-IPA
          path: AdShieldPro-Unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish Unsigned IPA to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "AdShield Pro v1.0.${{ github.run_number }} (Unsigned IPA)"
          body: |
            ### AdShield Pro - Bản Build Tự Động #${{ github.run_number }}
            - **File cài đặt:** `AdShieldPro-Unsigned.ipa` (chưa ký, đã gắn fake-sign `ldid` cho TrollStore / ESign / Feather / Sideloadly / AltStore).
            - **Commit:** `${{ github.sha }}`
            - **Tính năng:** Chặn quảng cáo toàn hệ thống qua DNS-over-HTTPS (DoH) + Safari Content Blocker Extension.
          files: AdShieldPro-Unsigned.ipa
          draft: false
          prerelease: false
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}